<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場チェック</title>
<style>
body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #e0e0e0; font-size: 20px; }
h1 { color: #4fc3f7; font-size: 22px; }
pre { background: #2a2a2a; padding: 20px; border-radius: 8px; white-space: pre-wrap; font-size: 20px; line-height: 1.8; }
.stock-row { display: flex; align-items: center; margin: 10px 0; flex-wrap: wrap; gap: 8px; }
.stock-name { color: #e0e0e0; min-width: 220px; font-size: 20px; }
.btn-chart {
  padding: 10px 20px;
  background: #1565c0;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 20px;
}
.btn-kabutan {
  padding: 10px 20px;
  background: #2e7d32;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 20px;
}
.btn-chart:hover { background: #1976d2; }
.btn-kabutan:hover { background: #388e3c; }
</style>
</head>
<body>
<h1>📈 市場チェック</h1>

<div class="stock-row">
  <span class="stock-name">📊 日経平均</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=TVC:NI225" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://kabutan.jp/stock/chart?code=0000" target="_blank">株探</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 SOX指数</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=NASDAQ:SOX" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://jp.investing.com/indices/phlx-semiconductor" target="_blank">株探</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 NVDA</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=NASDAQ:NVDA" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://kabutan.jp/stock/chart?code=NVDA" target="_blank">株探</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 VIX</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=TVC:VIX" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://jp.investing.com/indices/volatility-s-p-500" target="_blank">Investing</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 東京エレクトロン</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=TSE:8035" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://kabutan.jp/stock/chart?code=8035" target="_blank">株探</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 ディスコ</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=TSE:6146" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://kabutan.jp/stock/chart?code=6146" target="_blank">株探</a>
</div>
<div class="stock-row">
  <span class="stock-name">📊 東京電力</span>
  <a class="btn-chart" href="https://jp.tradingview.com/chart/?symbol=TSE:9501" target="_blank">チャート</a>
  <a class="btn-kabutan" href="https://kabutan.jp/stock/chart?code=9501" target="_blank">株探</a>
</div>

<br>
<pre id="result">読み込み中...</pre>
<script>
fetch('result.txt?t=' + Date.now())
  .then(r => r.text())
  .then(t => document.getElementById('result').textContent = t)
  .catch(() => document.getElementById('result').textContent = 'データがまだありません');
</script>
</body>
</html>
