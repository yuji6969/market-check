<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場チェック</title>
<style>
body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
h1 { color: #4fc3f7; }
pre { background: #2a2a2a; padding: 20px; border-radius: 8px; white-space: pre-wrap; }
.links { margin-bottom: 20px; }
.links a {
  display: inline-block;
  margin: 5px;
  padding: 8px 14px;
  background: #2a2a2a;
  color: #4fc3f7;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
}
.links a:hover { background: #3a3a3a; }
</style>
</head>
<body>
<h1>📈 市場チェック</h1>
<div class="links">
  <a href="https://jp.tradingview.com/chart/?symbol=TVC:NI225" target="_blank">📊 日経平均</a>
  <a href="https://jp.tradingview.com/chart/?symbol=NASDAQ:SOX" target="_blank">📊 SOX指数</a>
  <a href="https://jp.tradingview.com/chart/?symbol=NASDAQ:NVDA" target="_blank">📊 NVDA</a>
  <a href="https://jp.tradingview.com/chart/?symbol=TSE:8035" target="_blank">📊 東京エレクトロン</a>
  <a href="https://jp.tradingview.com/chart/?symbol=TSE:6146" target="_blank">📊 ディスコ</a>
  <a href="https://jp.tradingview.com/chart/?symbol=TSE:9501" target="_blank">📊 東京電力</a>
  <a href="https://jp.tradingview.com/chart/?symbol=TVC:VIX" target="_blank">📊 VIX</a>
</div>
<pre id="result">読み込み中...</pre>
<script>
fetch('result.txt?t=' + Date.now())
  .then(r => r.text())
  .then(t => document.getElementById('result').textContent = t)
  .catch(() => document.getElementById('result').textContent = 'データがまだありません');
</script>
</body>
</html>
